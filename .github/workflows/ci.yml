name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step below calls ./run.sh, the single gate entry point documented in
# docs/RUN_GUIDE.md. The commands are not repeated here, so a local arm and its
# CI step cannot drift apart. The gate job installs the locked environment once
# and reuses it for every arm; the conformance job is separate because it
# prepares the pinned parser in its own virtualenv.
jobs:
  gate:
    name: gate (lint, tests, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"

      - name: Install the locked environment once
        run: uv sync --frozen --extra dev

      - name: Lint
        run: ./run.sh lint

      - name: Fast tests
        run: ./run.sh test

      - name: Full tests with the coverage floor
        # Documented gate: the full suite with --cov=src --cov-fail-under=90.
        # Tests that need the generated output surface or the sibling render
        # toolchain skip with explicit reasons naming the missing artifact.
        run: ./run.sh test-full

      - name: Documentation links and generated timing contract
        run: ./run.sh docs

  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GNN_SCRATCH: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"

      - name: Run the pinned GNN conformance gate
        # The pin is the gate, not a convenience input. A missing pin, a
        # malformed pin, an unreachable repository, a fetched revision that
        # disagrees with the file, or a skipped parser test fails the arm.
        run: ./run.sh gnn
