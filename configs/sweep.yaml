run_id: sweep
seed: 11
output_dir: output/runs/sweep

fractalrabbit:
  upstream_repo: https://github.com/NationalSecurityAgency/fractalrabbit.git
  upstream_commit: 9933449c4f4fe1b26b6ac7bfdeeac76583085df5
  cache_dir: .cache/fractalrabbit
  execution: fixture
  fixture_csv: data/fixtures/fractalrabbit_sample_large.csv
  output_prefix: sweep
  params:
    space_dimension: 2
    fractal_dimension: 1.33
    number_of_points: 5000
    number_of_travellers: 5
    number_of_co_travellers: 1
    number_of_days: 36.0
    number_of_reports: 480.0

observation:
  spatial_discretizer: quantile
  spatial_bins: 4
  spatial_bounds: null
  time_bins_per_day: 4
  speed_thresholds_km_per_day: [10.0, 50.0, 150.0]
  burst_threshold_rule: median_positive
  burst_fixed_days: null

model:
  smoothing: 0.05
  controls: [empirical_continuation, high_entropy_exploration, identity]
  preference_prior: uniform

experiment:
  repetitions: 2
  holdout_fraction: 0.0
  objective_direction: minimize
  tie_breaker: declaration_order

figures:
  enabled:
    - waypoint_paths
    - spatial_bins
    - reporting_bursts
    - speed_categories
    - transition_heatmap
    - likelihood_panels
    - posterior_entropy
    - policy_proxy
    - candidate_scores
    - dataflow
  dpi: 220
  registry_path: output/figures/figure_registry.json

closed_loop:
  iterations: 2
  objective: posterior_entropy
  objective_direction: minimize
  tie_breaker: declaration_order
  candidates:
    - name: coarse_reports
      params:
        number_of_reports: 320.0
    - name: dense_reports
      params:
        number_of_reports: 960.0
robustness:
  n_realizations: 10
  upstream_candidate_limit: 5
  external_realization_fractal_dimensions: [1.21, 1.45, 1.7]
  stop_on_external_unavailable: true
